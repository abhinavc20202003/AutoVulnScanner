<!DOCTYPE html>
<html>
<head>
    <title>AutoVulnScanner</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-dark text-white">

<div class="container text-center mt-5">
    <h1 class="display-4">AutoVulnScanner</h1>
    <p class="lead">Cybersecurity Scanner Dashboard</p>

    <hr>

    <form method="POST" action="/scan">
        <input type="text" name="target" placeholder="Enter target (domain)" class="form-control mt-3" required>

        <button type="submit" class="btn btn-primary mt-3">Start Scan</button>
    </form>

    <a href="/history" class="btn btn-info mt-3">View Scan History</a>
</div>

</body>
</html>
